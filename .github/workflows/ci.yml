name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The web app has its own vitest config - the root one roots at the repo
      # and would never see apps/web/test - and its own tsc and vite build.
      # None of that runs above, so a broken worker or a failing week-maths
      # test would have sailed through CI.
      - name: Test web app
        run: npm test --workspace @recipe-vault/web

      - name: Typecheck web app
        run: npm run typecheck --workspace @recipe-vault/web

      - name: Build web app
        run: npm run build --workspace @recipe-vault/web

      - name: Check release files are at repo root
        run: |
          for f in main.js manifest.json styles.css; do
            test -f "$f" || { echo "missing $f at repo root"; exit 1; }
          done
