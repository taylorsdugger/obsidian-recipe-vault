name: Publish core

# Bumps packages/core, tags it core-v<version>, and publishes it to npm.
# Separate from the plugin release, so core and the plugin keep their own
# version numbers.
#
# npm trusts this workflow through trusted publishing (OIDC), so there's no
# NPM_TOKEN secret. The trusted publisher is set on the package's settings page
# on npmjs.com and has to name this file.

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm test -w packages/core

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          npm version "$VERSION_TYPE" -w packages/core --no-git-tag-version
          VERSION=$(node -p "require('./packages/core/package.json').version")
          git commit -am "core $VERSION"
          git tag "core-v$VERSION"

      # Push before publishing. If the push fails nothing went to npm, and a
      # rerun bumps from the same version again.
      - name: Push Commit and Tag
        run: git push origin HEAD --follow-tags

      # prepack builds dist first.
      - name: Publish
        run: npm publish -w packages/core --access public
