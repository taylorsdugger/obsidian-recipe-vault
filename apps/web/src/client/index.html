<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- The canvas colour, so the browser chrome runs into the page. Hex
         rather than the oklch tokens: older Android Chrome ignores a
         theme-color it can't parse. -->
    <meta
      name="theme-color"
      content="#faf8f5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#13110f"
      media="(prefers-color-scheme: dark)"
    />
    <!-- The titles are set in it, so fetch it alongside the css rather than
         after it. -->
    <link
      rel="preload"
      href="/fonts/newsreader.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS ignores the manifest's display mode; this is what makes an
         installed icon open without Safari's chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Recipes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- A theme forced on the settings screen, put on before first paint so
         the other one doesn't flash. src/client/theme.ts owns the rest. -->
    <script>
      try {
        var theme = localStorage.getItem("recipe-vault:theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    </script>
    <title>Recipe Vault</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
